name: Release

# Builds ForeverLedger-<tag>.zip and publishes it to GitHub Releases.
# Started by the Tag version workflow, or by pushing a v* tag directly.
# CurseForge / Wago uploads switch on once their secrets (CF_API_KEY,
# WAGO_API_TOKEN) and project IDs in the .toc are added.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
