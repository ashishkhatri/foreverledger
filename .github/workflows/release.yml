name: Release

# To release: change the "## Version:" line in ForeverLedger.toc and push to main.
# If that version has no release yet, this tags it (v<version>), builds
# ForeverLedger-v<version>.zip and publishes it as a GitHub Release.
# It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - ForeverLedger.toc
      - .github/workflows/**
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from the .toc
        id: ver
        run: |
          v=$(grep -m1 '^## Version:' ForeverLedger.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ -z "$v" ]; then echo "No ## Version line found"; exit 1; fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.ver.outputs.new == 'true'
        run: |
          mkdir -p dist/ForeverLedger
          cp ForeverLedger.toc ForeverLedger.lua LICENSE dist/ForeverLedger/
          cp -r media dist/ForeverLedger/
          cd dist && zip -r "ForeverLedger-${{ steps.ver.outputs.tag }}.zip" ForeverLedger

      - name: Tag and publish
        if: steps.ver.outputs.new == 'true'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" "dist/ForeverLedger-$tag.zip" \
            --verify-tag \
            --title "Forever Ledger $tag" \
            --notes "Unzip into \`World of Warcraft\\_forever_\\Interface\\AddOns\\\` so you end up with \`AddOns\\ForeverLedger\\ForeverLedger.toc\`. Restart the game the first time so the icons load."
