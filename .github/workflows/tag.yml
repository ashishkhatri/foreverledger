name: Tag version

# To release: change the "## Version:" line in ForeverLedger.toc and push to main.
# This tags that version (v<version>) if it isn't tagged yet, and starts the
# Release workflow on the tag if that version has no release yet.
on:
  push:
    branches: [main]
    paths:
      - ForeverLedger.toc
      - .github/workflows/**
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release the .toc version
        run: |
          v=$(grep -m1 '^## Version:' ForeverLedger.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ -z "$v" ]; then echo "No ## Version line found"; exit 1; fi
          tag="v$v"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
          else
            gh workflow run release.yml --ref "$tag"
            echo "Started the Release workflow for $tag."
          fi
